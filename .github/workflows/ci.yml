name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Solidity
        run: npm run compile
      - name: Test contracts
        run: npm test
      - name: Type-check frontend
        run: npm run typecheck
      - name: Type-check deployment scripts
        run: npx tsc --noEmit -p tsconfig.hardhat.json
      - name: Build production frontend
        run: npm run build
